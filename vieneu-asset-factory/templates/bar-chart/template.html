<div class="broll-barchart"><div class="broll-barchart-title">{{title}}</div><div class="broll-barchart-plot"><div class="broll-barchart-col"><span class="broll-barchart-val" style="bottom:calc({{w1}}% * 0.75 + .35em)">{{value1}}</span><div class="broll-barchart-bar broll-barchart-tone-{{tone1}}" style="height:calc({{w1}}% * 0.75)"></div></div><div class="broll-barchart-col"><span class="broll-barchart-val" style="bottom:calc({{w2}}% * 0.75 + .35em)">{{value2}}</span><div class="broll-barchart-bar broll-barchart-tone-{{tone2}}" style="height:calc({{w2}}% * 0.75)"></div></div><div class="broll-barchart-col"><span class="broll-barchart-val" style="bottom:calc({{w3}}% * 0.75 + .35em)">{{value3}}</span><div class="broll-barchart-bar broll-barchart-tone-{{tone3}}" style="height:calc({{w3}}% * 0.75)"></div></div><div class="broll-barchart-col"><span class="broll-barchart-val" style="bottom:calc({{w4}}% * 0.75 + .35em)">{{value4}}</span><div class="broll-barchart-bar broll-barchart-tone-{{tone4}}" style="height:calc({{w4}}% * 0.75)"></div></div></div><div class="broll-barchart-labs"><span class="broll-barchart-lab">{{label1}}</span><span class="broll-barchart-lab">{{label2}}</span><span class="broll-barchart-lab">{{label3}}</span><span class="broll-barchart-lab">{{label4}}</span></div><div class="broll-barchart-foot">{{foot}}</div></div>
