  rationale: Keyword-strip 1.6.0 was reported complete after an eye check plus check_templates with 34 samples and 0 errors, yet the 2026-11-01T23:12 user report found its keyword blocks missing their background, because neither check asserted the required background on a real rendered image. The 1.7.0 fix added an 8-check rendered-image test and 1.8.0 extended it to 11 checks, which is the method this new skill codifies. The existing QA skill requires a render trial and frame comparison but does not require an automated pixel assertion before confirmation, and the QA skill is a pre-existing custom file with learning null, so this loop cannot update it directly. A separate managed skill therefore closes the gap without duplicating the QA skill or restating the app webview lesson, which the system app-creation skill already covers by requiring confirmation from the running app.
